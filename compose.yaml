name: stafftaskspace
services:
  app:
    image: stafftaskspace:latest
    networks:
      - backend-net
    ports:
      - ${PORTS}
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres:17.7-alpine
    volumes:
     - dbdata:/var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      timeout: 5s
      retries: 5

networks:
  backend-net:

volumes:
  dbdata: