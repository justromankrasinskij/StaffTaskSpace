<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="" />
	<title>Вход в систему</title>
	<link href="css/bootstrap.min.css" rel="stylesheet" />
	<link href="css/login.css" rel="stylesheet" />
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
	<main class="form-signin w-100 m-auto mt-0">
		<form action="/login" method="post">
			<img class="mb-4" src="/svg/logo.svg" width="256" height="256" />
			<div class="text-center">
				<h1 class="h3 mb-3 mt-4 fw-normal">Вход в систему <br>Staff Task Space</h1>
			</div>
			<div class="form-floating">
				<input type="text" class="form-control" id="username" name="username" placeholder="Имя пользователя" />
				<label for="username">Имя пользователя</label>
			</div>
			<div class="form-floating">
				<input type="password" class="form-control" id="password" name="password" placeholder="Пароль" />
				<label for="password">Пароль</label>
			</div>
			<button class="btn btn-primary w-100 py-2" type="submit">
				Войти
			</button>
			<p class="mt-3 text-body-secondary">Если у вас ещё нет учётной записи,<br>
				пройдите <a href="/users/save">регистрацию в системе.</a>
			</p>
		</form>
	</main>
	<script src="/js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>
</body>
</html>
